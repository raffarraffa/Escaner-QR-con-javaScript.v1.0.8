<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="manifest.json?v=3.5.0">
  <title>DNI Scanner Master Pro+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ZXing Pinned Version requested by user -->
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .scanner-view-container {
      width: 100%;
      max-width: 400px;
      height: 400px;
      margin: 10px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: none;
      border: 3px solid #198754;
    }

    #preview-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .dni-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 45%;
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
    }

    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #00ff00;
      box-shadow: 0 0 15px 2px #00ff00;
      animation: scan-dni 3s linear infinite;
    }

    @keyframes scan-dni {
      0% {
        top: 0%;
      }

      50% {
        top: 100%;
      }

      100% {
        top: 0%;
      }
    }

    .app-wrapper {
      max-width: 400px;
      width: 95%;
      margin: 2vh auto;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 15px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body {
      background: #e9ecef;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .dni-result-table {
      width: 100%;
      font-size: 0.85rem;
      border-collapse: collapse;
      margin-top: 10px;
      text-align: left;
    }

    .dni-result-table td {
      padding: 6px;
      border: 1px solid #eee;
    }

    .dni-result-table td:first-child {
      font-weight: bold;
      color: #198754;
      width: 40%;
    }

    .qr-result-box {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 1rem;
      border: 1px solid #ccc;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="container-fluid">
      <h5 class="text-center mb-0 mt-2">DNI Scanner 🔬</h5>
      <p class="text-center text-muted small mb-3">Versión 3.5.0 - ZXing 0.20.0</p>

      <div id="scanner-container" class="scanner-view-container">
        <canvas id="preview-canvas"></canvas>
        <div class="dni-guide">
          <div class="scanner-line"></div>
        </div>
      </div>

      <div class="text-center" id="qr-icon-container">
        <img src="assets/icons/qr.png" class="img-fluid" width="120" onerror="this.style.display='none'">
        <p class="mt-3 text-muted small">Optimizado para DNIs y códigos complejos</p>
      </div>

      <div class="text-center mt-3">
        <button id="start-btn" class="btn btn-success btn-lg w-100 mb-2" onclick="startMicroscope()">🚀 INICIAR
          ESCANEO</button>
        <button id="stop-btn" class="btn btn-danger btn-sm" onclick="stopMicroscope()"
          style="display:none">DETENER</button>
      </div>
    </div>

    <div class="mt-auto text-center py-2">
      <small class="text-muted" style="font-size: 0.6rem;">ANALIZADOR DE PÍXELES DE ALTA PRECISIÓN</small>
    </div>
  </div>

  <script>
    const video = document.createElement("video");
    const previewCanvas = document.getElementById("preview-canvas");
    const previewCtx = previewCanvas.getContext("2d");
    const procCanvas = document.createElement("canvas");
    const procCtx = procCanvas.getContext("2d", { willReadFrequently: true });

    let active = false;
    let stream = null;
    let codeReader = null;
    let scanInterval = null;

    async function startMicroscope() {
      try {
        const constraints = {
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.setAttribute("playsinline", "true");
        await video.play();

        active = true;
        document.getElementById('scanner-container').style.display = 'block';
        document.getElementById('qr-icon-container').style.display = 'none';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'inline-block';

        // Usamos la instancia global de ZXing del UMD minificado
        codeReader = new ZXing.BrowserMultiFormatReader();
        console.log("ZXing Reader inicializado v0.20.0");

        requestAnimationFrame(processFrame);
        scanInterval = setInterval(attemptDecode, 200);

      } catch (err) {
        console.error(err);
        Swal.fire('Error', 'No se pudo activar la cámara HD.', 'error');
      }
    }

    function processFrame() {
      if (!active) return;
      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const zoomSize = Math.min(vW, vH) * 0.45;
      const sX = (vW - zoomSize) / 2;
      const sY = (vH - zoomSize) / 2;

      previewCanvas.width = 600;
      previewCanvas.height = 600;
      previewCtx.filter = 'contrast(1.2) brightness(1.1)';
      previewCtx.drawImage(video, sX, sY, zoomSize, zoomSize, 0, 0, 600, 600);

      procCanvas.width = 1200;
      procCanvas.height = 1200;
      procCtx.filter = 'grayscale(100%) contrast(2.5) brightness(1.2)';
      procCtx.drawImage(video, sX, sY, zoomSize, zoomSize, 0, 0, 1200, 1200);

      requestAnimationFrame(processFrame);
    }

    async function attemptDecode() {
      if (!active || !codeReader) return;
      try {
        const result = await codeReader.decodeFromCanvas(procCanvas);
        if (result) onScanSuccess(result.text);
      } catch (e) { }
    }

    function parseDNI(text) {
      const parts = text.split('@');
      if (parts.length < 8) return null;
      return {
        dni: parts[4] || '?',
        apellido: parts[1] || '?',
        nombre: parts[2] || '?',
        sexo: parts[3] || '?',
        nacimiento: parts[6] || '?',
        ejemplar: parts[5] || '?'
      };
    }

    function onScanSuccess(text) {
      stopMicroscope();
      const dni = parseDNI(text);

      if (dni) {
        Swal.fire({
          title: '📄 DNI Detectado',
          html: `
            <table class="dni-result-table">
              <tr><td>DNI:</td><td>${dni.dni}</td></tr>
              <tr><td>Apellido:</td><td>${dni.apellido}</td></tr>
              <tr><td>Nombre:</td><td>${dni.nombre}</td></tr>
              <tr><td>Sexo:</td><td>${dni.sexo}</td></tr>
              <tr><td>Nacimiento:</td><td>${dni.nacimiento}</td></tr>
              <tr><td>Ejemplar:</td><td>${dni.ejemplar}</td></tr>
            </table>
          `,
          icon: 'success',
          confirmButtonText: 'Aceptar'
        });
      } else {
        Swal.fire({
          title: '📱 Código Detectado',
          html: `<div class="qr-result-box">${text}</div>`,
          icon: 'info',
          confirmButtonText: 'Aceptar'
        });
      }
    }

    function stopMicroscope() {
      active = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (scanInterval) clearInterval(scanInterval);
      document.getElementById('scanner-container').style.display = 'none';
      document.getElementById('qr-icon-container').style.display = 'block';
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('stop-btn').style.display = 'none';
    }

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=3.5.0');
      }
    });
  </script>
</body>

</html>
