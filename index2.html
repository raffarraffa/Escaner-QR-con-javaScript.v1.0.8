<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="manifest.json?v=4.0.0">
  <title>Scanner DNI & QR Universal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .scanner-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
      display: none;
      min-height: 450px;
      border: 2px solid #198754;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
      transform: scale(1.3);
      filter: contrast(1.2);
    }

    .app-wrapper {
      max-width: 400px;
      width: 95%;
      margin: 2vh auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body {
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      display: inline-block;
      font-weight: bold;
    }

    .instruction-text {
      font-size: 0.85rem;
      color: #444;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .zoom-hint {
      color: #157347;
      font-weight: bold;
      display: block;
      margin-top: 5px;
    }

    .dni-data {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid #dee2e6;
      margin-top: 10px;
    }

    .dni-data .field {
      margin-bottom: 8px;
      padding: 5px;
      background: white;
      border-radius: 5px;
    }

    .dni-data .label {
      font-weight: bold;
      color: #198754;
      display: inline-block;
      min-width: 120px;
    }

    .qr-data {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 10px;
      word-break: break-all;
      font-size: 1rem;
      border: 1px solid #ccc;
      text-align: left;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="container-fluid">
      <h5 class="text-center mb-1 mt-2">Scanner DNI & QR 📱</h5>
      <p class="text-center text-muted small mb-1">Escanea DNI (PDF417) y QR comunes</p>

      <div id="instruction" class="text-center instruction-text">
        Coloca el código a 20-25 cm de la cámara
      </div>

      <div id="scanner-container" class="scanner-wrapper">
        <div id="reader"></div>
      </div>

      <div class="text-center" id="qr-icon-container">
        <a id="btn-scan-qr" href="#" onclick="startScanner()">
          <img src="assets/icons/qr.png" class="img-fluid" width="120" onerror="this.style.display='none'">
        </a>
      </div>

      <div class="text-center mt-3">
        <div id="action-buttons">
          <button id="start-btn" class="btn btn-success btn-lg w-100 shadow-sm" onclick="startScanner()">
            🚀 ESCANEAR AHORA
          </button>
          <button id="stop-btn" class="btn btn-danger btn-sm" onclick="stopScanner()" style="display:none">
            DETENER CÁMARA
          </button>
        </div>
        <div class="mt-2 text-center">
          <span id="scan-status" class="status-badge bg-success text-white" style="display:none">
            🔥 SCANNER ACTIVO
          </span>
        </div>
        <div class="mt-3">
          <button id="btnInstall" class="btn btn-outline-primary btn-sm" style="display:none">
            Instalar Aplicación
          </button>
        </div>
      </div>
    </div>

    <div class="mt-auto text-center py-2">
      <small class="text-muted" style="font-size: 0.65rem;">version 4.0.0 - Universal Scanner</small>
    </div>
  </div>

  <script>
    let html5QrCode;
    let deferredPrompt;

    function parseDNI_PDF417(text) {
      // Formato DNI Argentina PDF417
      // Campos separados por @
      const parts = text.split('@');
      
      if (parts.length < 8) {
        return null;
      }

      // Estructura típica:
      // 0: Código trámite
      // 1: Apellido
      // 2: Nombre
      // 3: Sexo
      // 4: DNI
      // 5: Ejemplar
      // 6: Fecha nacimiento
      // 7: Fecha emisión
      
      return {
        tipo: 'DNI',
        tramite: parts[0] || '',
        apellido: parts[1] || '',
        nombre: parts[2] || '',
        sexo: parts[3] || '',
        dni: parts[4] || '',
        ejemplar: parts[5] || '',
        fechaNacimiento: parts[6] || '',
        fechaEmision: parts[7] || '',
        raw: text
      };
    }

    function mostrarDatosDNI(datos) {
      const html = `
        <div class="dni-data">
          <div class="field"><span class="label">DNI:</span> ${datos.dni}</div>
          <div class="field"><span class="label">Apellido:</span> ${datos.apellido}</div>
          <div class="field"><span class="label">Nombre:</span> ${datos.nombre}</div>
          <div class="field"><span class="label">Sexo:</span> ${datos.sexo}</div>
          <div class="field"><span class="label">F. Nacimiento:</span> ${datos.fechaNacimiento}</div>
          <div class="field"><span class="label">F. Emisión:</span> ${datos.fechaEmision}</div>
          <div class="field"><span class="label">Trámite:</span> ${datos.tramite}</div>
          <div class="field"><span class="label">Ejemplar:</span> ${datos.ejemplar}</div>
        </div>
      `;

      Swal.fire({
        title: '📄 DNI Escaneado',
        html: html,
        icon: 'success',
        confirmButtonText: 'Cerrar',
        width: '90%'
      });
    }

    function mostrarQRComun(texto) {
      // Detectar si es una URL
      const esURL = texto.startsWith('http://') || texto.startsWith('https://');
      
      let html = `<div class="qr-data">${texto}</div>`;
      
      if (esURL) {
        html += `<div class="mt-3">
          <a href="${texto}" target="_blank" class="btn btn-primary btn-sm">
            🔗 Abrir enlace
          </a>
        </div>`;
      }

      Swal.fire({
        title: '📱 QR Escaneado',
        html: html,
        icon: 'info',
        confirmButtonText: 'Cerrar',
        width: '90%'
      });
    }

    async function applyHardwareZoom(track) {
      try {
        const capabilities = track.getCapabilities();

        if (capabilities.zoom) {
          const targetZoom = Math.min(2.5, capabilities.zoom.max);
          console.log(`Aplicando Zoom Hardware: ${targetZoom}x`);
          await track.applyConstraints({
            advanced: [{ zoom: targetZoom }]
          });
          return true;
        }
      } catch (e) {
        console.warn("Hardware zoom no soportado:", e);
      }
      return false;
    }

    async function startScanner() {
      const container = document.getElementById('scanner-container');
      const iconContainer = document.getElementById('qr-icon-container');
      const startBtn = document.getElementById('start-btn');
      const stopBtn = document.getElementById('stop-btn');
      const statusBadge = document.getElementById('scan-status');
      const instruction = document.getElementById('instruction');

      container.style.display = 'block';
      iconContainer.style.display = 'none';
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      statusBadge.style.display = 'inline-block';
      instruction.innerHTML = "Mantén el código quieto... <span class='zoom-hint'>¡Enfocando automáticamente!</span>";

      html5QrCode = new Html5Qrcode("reader", {
        verbose: false,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      });

      const config = {
        fps: 30,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          return {
            width: viewfinderWidth * 0.8,
            height: viewfinderHeight * 0.4
          }
        },
        aspectRatio: 1.0,
        videoConstraints: {
          facingMode: "environment",
          focusMode: "continuous",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        // Soportar múltiples formatos
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.PDF_417,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.AZTEC,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText, decodedResult) => {
            onScanSuccess(decodedText, decodedResult);
          },
          (errorMessage) => { }
        );

        // Aplicar zoom óptico si es posible
        const videoElement = document.querySelector('#reader video');
        if (videoElement && videoElement.srcObject) {
          const track = videoElement.srcObject.getVideoTracks()[0];
          const zoomOk = await applyHardwareZoom(track);
          if (zoomOk) {
            statusBadge.innerText = "🔥 ZOOM ÓPTICO ACTIVO";
            statusBadge.className = "status-badge bg-warning text-dark";
          }
        }

      } catch (err) {
        console.error("Error:", err);
        Swal.fire('Error', 'No se pudo acceder a la cámara: ' + err.message, 'error');
        resetUI();
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      stopScanner();

      console.log("Código detectado:", decodedResult.result.format.format);
      console.log("Contenido:", decodedText);

      // Intentar parsear como DNI (PDF417)
      const datosDNI = parseDNI_PDF417(decodedText);
      
      if (datosDNI) {
        // Es un DNI argentino
        mostrarDatosDNI(datosDNI);
      } else {
        // Es un QR común u otro código
        mostrarQRComun(decodedText);
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        try {
          await html5QrCode.stop();
          resetUI();
        } catch (err) {
          console.error("Error:", err);
        }
      } else {
        resetUI();
      }
    }

    function resetUI() {
      document.getElementById('scanner-container').style.display = 'none';
      document.getElementById('qr-icon-container').style.display = 'block';
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('scan-status').style.display = 'none';
      document.getElementById('instruction').innerText = "Coloca el código a 20-25 cm de la cámara";
    }

    // Service Worker
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=4.0.0')
          .then(reg => console.log('SW registrado'))
          .catch(err => console.error('SW error', err));
      }
    });

    // PWA Install
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstall');
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            btn.style.display = 'none';
          } else {
            btn.style.display = 'inline-block';
          }
          deferredPrompt = null;
        });
      };
    });
  </script>
</body>

</html>
