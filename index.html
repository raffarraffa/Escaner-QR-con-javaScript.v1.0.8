<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="manifest.json?v=2.1.0">
  <title>Validador QR Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="assets/plugins/qrCode.min.js?v=2.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .canvas-container {
      width: 100%;
      max-width: 400px;
      height: 120px;
      margin: 10px auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: none;
    }

    #qr-canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 0, 0, 0.7);
      box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.5);
      z-index: 10;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 0%;
      }

      50% {
        top: 100%;
      }

      100% {
        top: 0%;
      }
    }

    .camera-selector {
      display: none;
      margin-bottom: 10px;
    }

    .camera-btn {
      margin: 2px;
      font-size: 0.8rem;
    }

    .app-wrapper {
      max-width: 400px;
      width: 95%;
      margin: 2vh auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body {
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="container-fluid">
      <h5 class="text-center mb-2 mt-2">Escanear código QR</h5>

      <div id="cameraSelector" class="camera-selector">
        <label class="form-label mb-1" style="font-size: 0.8rem;">Seleccionar cámara:</label>
        <div id="cameraList" class="d-flex flex-wrap justify-content-center"></div>
      </div>

      <div id="canvas-container" class="canvas-container">
        <canvas hidden id="qr-canvas"></canvas>
        <div hidden id="scanner-line" class="scanner-line"></div>
      </div>

      <div class="text-center">
        <a id="btn-scan-qr" href="#">
          <img src="assets/icons/qr.png" class="img-fluid" width="100">
        </a>
      </div>

      <div class="text-center mt-3">
        <button class="btn btn-success btn-sm" onclick="encenderCamara()">Escanear QR</button>
        <button class="btn btn-danger btn-sm" onclick="cerrarCamara()">Apagar cámara</button>
        <div class="mt-2">
          <button id="btnInstall" class="btn btn-primary btn-sm" style="display:none">Instalar App</button>
        </div>
      </div>
    </div>

    <div class="mt-auto text-center py-2">
      <small class="text-muted" style="font-size: 0.65rem;">version 2.1.0</small>
    </div>
  </div>

  <script>
    const video = document.createElement("video");
    const canvasElement = document.getElementById("qr-canvas");
    const scannerLine = document.getElementById("scanner-line");
    const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
    const canvasContainer = document.getElementById("canvas-container");
    const btnScanQR = document.getElementById("btn-scan-qr");

    let scanning = false;
    let animationFrameId = null;
    let scanTimeoutId = null;
    let videoStream = null;
    let cameras = [];
    let currentCameraId = null;
    let deferredPrompt;

    const SCAN_CONFIG = {
      scanInterval: 100,
      maxScanTime: 45000,
    };

    async function listarCamaras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameras = devices.filter(device => device.kind === 'videoinput');
        if (cameras.length > 1) {
          mostrarSelectorCamaras();
        }
        return cameras;
      } catch (error) {
        console.error('Error al listar cámaras:', error);
        return [];
      }
    }

    function mostrarSelectorCamaras() {
      const cameraList = document.getElementById('cameraList');
      const cameraSelector = document.getElementById('cameraSelector');
      cameraList.innerHTML = '';
      cameraSelector.style.display = 'block';

      cameras.forEach((camera, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-outline-primary btn-sm camera-btn';
        button.textContent = `Cam ${index + 1}`;
        button.onclick = (e) => cambiarCamara(camera.deviceId, e);
        if (camera.deviceId === currentCameraId) button.classList.add('active');
        cameraList.appendChild(button);
      });
    }

    async function cambiarCamara(deviceId, event) {
      if (!deviceId) return;
      try {
        detenerProcesos();
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
          videoStream = null;
        }

        const constraints = {
          video: {
            deviceId: { exact: deviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        currentCameraId = deviceId;

        document.querySelectorAll('.camera-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
          event.target.classList.add('active');
        }

        video.srcObject = videoStream;
        video.setAttribute("playsinline", "true");
        await video.play();

        scanning = true;
        canvasContainer.style.display = 'block';
        canvasElement.hidden = false;
        scannerLine.hidden = false;
        iniciarEscaneo();
      } catch (error) {
        console.error('Error al cambiar cámara:', error);
      }
    }

    async function encenderCamara() {
      try {
        detenerProcesos();
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
          videoStream = null;
        }

        await listarCamaras();

        let constraints = {
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        if (currentCameraId) {
          constraints.video.facingMode = undefined;
          constraints.video.deviceId = { exact: currentCameraId };
        }

        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        const videoTrack = videoStream.getVideoTracks()[0];
        currentCameraId = videoTrack.getSettings().deviceId;

        scanning = true;
        canvasContainer.style.display = 'block';
        canvasElement.hidden = false;
        scannerLine.hidden = false;
        btnScanQR.style.display = 'none';

        video.srcObject = videoStream;
        video.setAttribute("playsinline", "true");
        await video.play();

        iniciarEscaneo();
      } catch (error) {
        console.error("Error al acceder a la cámara:", error);
      }
    }

    function tick() {
      if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
        animationFrameId = requestAnimationFrame(tick);
        return;
      }
      canvasElement.width = video.videoWidth;
      canvasElement.height = video.videoHeight;
      canvas.filter = 'grayscale(100%)'; // Apply grayscale filter for better QR detection
      canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);


      if (scanning) animationFrameId = requestAnimationFrame(tick);
    }

    function scan() {
      if (!scanning) return;
      try {
        qrcode.decode();
      } catch (e) {
        scanTimeoutId = setTimeout(scan, SCAN_CONFIG.scanInterval);
      }
    }

    function iniciarEscaneo() {
      tick();
      scan();
      setTimeout(() => {
        if (scanning) cerrarCamara();
      }, SCAN_CONFIG.maxScanTime);
    }

    function detenerProcesos() {
      scanning = false;
      if (canvasContainer) canvasContainer.style.display = 'none';
      if (scannerLine) scannerLine.hidden = true;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (scanTimeoutId) {
        clearTimeout(scanTimeoutId);
        scanTimeoutId = null;
      }
    }

    function cerrarCamara() {
      scanning = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      video.srcObject = null;
      if (canvasContainer) canvasContainer.style.display = 'none';
      canvasElement.hidden = true;
      scannerLine.hidden = true;
      btnScanQR.style.display = 'block';
      document.getElementById('cameraSelector').style.display = 'none';
    }

    qrcode.callback = (respuesta) => {
      if (respuesta && scanning) {
        scanning = false;
        if (scannerLine) scannerLine.hidden = true;

        if (respuesta.includes('https://www.arca.gob.ar/fe/qr/') ||
          respuesta.includes('https://fe.arca.gob.ar/qr/') ||
          respuesta.includes('https://www.afip.gob.ar/fe/qr/')) {
          try {
            const url = new URL(respuesta);
            const p = url.searchParams.get('p');
            if (p) {
              // Deserialización más robusta para Base64
              const decoded = atob(p);
              const d = JSON.parse(decoded);

              Swal.fire({
                title: 'QR Válido',
                html: `<div style="text-align:left; font-size:0.9rem;">
                  <p>Factura: ${d.ptoVta.toString().padStart(5, '0')}-${d.nroCmp.toString().padStart(8, '0')}</p>
                  <p>CAE: ${d.codAut}</p>
                  <p>Fecha: ${d.fecha}</p>
                  <p>Monto: $ ${d.importe}</p>
                </div>`,
                icon: 'success'
              });
            } else {
              Swal.fire('Resultado', respuesta, 'info');
            }
          } catch (e) {
            console.error('Error al deserializar JSON de ARCA:', e);
            Swal.fire({
              title: 'Resultado QR',
              text: respuesta,
              icon: 'info'
            });
          }
        } else {
          Swal.fire({
            title: 'Resultado QR',
            text: respuesta,
            icon: 'info'
          });
        }
        cerrarCamara();
      }
    };

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=2.1.0')
          .then(reg => console.log('SW ok'))
          .catch(err => console.warn('SW error', err));
      }
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstall');
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the A2HS prompt');
          } else {
            console.log('User dismissed the A2HS prompt');
            btn.style.display = 'inline-block';
          }
          deferredPrompt = null;
        });
      };
    });
  </script>
</body>

</html>
