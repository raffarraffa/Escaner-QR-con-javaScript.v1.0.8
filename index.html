<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#198754">
  <link rel="manifest" href="manifest.json?v=3.1.0">
  <title>Validador QR & Barcode Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .scanner-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #000;
      display: none;
      min-height: 300px;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
    }

    .app-wrapper {
      max-width: 400px;
      width: 95%;
      margin: 2vh auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body {
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
      margin-bottom: 5px;
      display: inline-block;
    }

    .instruction-text {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="container-fluid">
      <h5 class="text-center mb-1 mt-2">Scanner QR</h5>
      <p class="text-center text-muted small mb-1">Optimizado para QRs Densos</p>

      <div id="instruction" class="text-center instruction-text">
        Presiona el icono para comenzar
      </div>

      <div id="scanner-container" class="scanner-wrapper">
        <div id="reader"></div>
      </div>

      <div class="text-center" id="qr-icon-container">
        <a id="btn-scan-qr" href="#" onclick="startScanner()">
          <img src="assets/icons/qr.png" class="img-fluid" width="100">
        </a>
      </div>

      <div class="text-center mt-3">
        <div id="action-buttons">
          <button id="start-btn" class="btn btn-success btn-sm" onclick="startScanner()">Escanear QR</button>
          <button id="stop-btn" class="btn btn-danger btn-sm" onclick="stopScanner()"
            style="display:none">Detener</button>
        </div>
        <div class="mt-2 text-center">
          <span id="scan-status" class="status-badge bg-primary text-white" style="display:none">Hardware Acelerado
            ACTIVO</span>
        </div>
        <div class="mt-2">
          <button id="btnInstall" class="btn btn-primary btn-sm" style="display:none">Instalar App</button>
        </div>
      </div>
    </div>

    <div class="mt-auto text-center py-2">
      <small class="text-muted" style="font-size: 0.65rem;">version 3.1.0 (Hardware-Accelerated)</small>
    </div>
  </div>

  <script>
    let html5QrCode;
    let deferredPrompt;

    async function startScanner() {
      const container = document.getElementById('scanner-container');
      const iconContainer = document.getElementById('qr-icon-container');
      const startBtn = document.getElementById('start-btn');
      const stopBtn = document.getElementById('stop-btn');
      const statusBadge = document.getElementById('scan-status');
      const instruction = document.getElementById('instruction');

      container.style.display = 'block';
      iconContainer.style.display = 'none';
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      statusBadge.style.display = 'inline-block';
      instruction.innerText = "Centra el DNI en el rectángulo";

      html5QrCode = new Html5Qrcode("reader", {
        verbose: false,
        // NOTA: Esta opción es experimental pero vital para DNI en Chrome/Android
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      });

      const config = {
        fps: 25, // Un poco más alto para mayor precisión
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          // El DNI es una tarjeta rectangular. Optimizamos el visor para 
          // PDF417 (largo) y DataMatrix.
          let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          let boxWidth = viewfinderWidth * 0.9;
          let boxHeight = viewfinderHeight * 0.5; // Más bajo y ancho

          return {
            width: boxWidth,
            height: boxHeight
          }
        },
        aspectRatio: 1.0,
        // Restricciones de video agresivas para FORZAR autofoco y HD
        videoConstraints: {
          facingMode: "environment",
          focusMode: "continuous",
          width: { min: 640, ideal: 1280, max: 1920 },
          height: { min: 480, ideal: 720, max: 1080 }
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText, decodedResult) => {
            onScanSuccess(decodedText, decodedResult);
          },
          (errorMessage) => {
            // Silencioso
          }
        );
      } catch (err) {
        console.error("Error al iniciar cámara:", err);
        Swal.fire('Error de Cámara', 'No se pudo activar el autofoco o la alta resolución.', 'error');
        resetUI();
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      stopScanner();

      Swal.fire({
        title: 'Código detectado',
        html: `<div style="text-align:left; font-family:monospace; background:#f4f4f4; padding:10px; border-radius:5px; word-break:break-all; font-size:0.9rem;">${decodedText}</div>`,
        icon: 'success',
        confirmButtonText: 'Aceptar'
      });
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        try {
          await html5QrCode.stop();
          resetUI();
        } catch (err) {
          console.error("Error al detener scanner:", err);
        }
      } else {
        resetUI();
      }
    }

    function resetUI() {
      document.getElementById('scanner-container').style.display = 'none';
      document.getElementById('qr-icon-container').style.display = 'block';
      document.getElementById('start-btn').style.display = 'inline-block';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('scan-status').style.display = 'none';
      document.getElementById('instruction').innerText = "Presiona el icono para comenzar";
    }

    // PWA Logic
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=3.1.0')
          .then(reg => console.log('SW ok'))
          .catch(err => console.error('SW error', err));
      }
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstall');
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            btn.style.display = 'none';
          } else {
            btn.style.display = 'inline-block';
          }
          deferredPrompt = null;
        });
      };
    });
  </script>
</body>

</html>
